    d="M55 40 h70 a20 20 0 0 1 20 20 v36 a20 20 0 0 1 -20 20 h-38 l-25 24 4 -24 h-11 a20 20 0 0 1 -20 -20 v-36 a20 20 0 0 1 20 -20 z"
    fill="#ffffff"
  />
  <path
    d="M66 79 l17 17 31 -34"
    fill="none"
    stroke="#15803d"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
